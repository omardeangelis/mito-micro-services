# Postgres 15, as production (15.6), for this machine only (127.0.0.1):
# - the tests on a real database (`*.pg.test.ts`, TEST_DATABASE_URL);
# - the local database `mito_local` (`db:local:*`).
# Start it with `pnpm db:local:up`; the data stays in the volume.
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_PASSWORD: local
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - mito-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  mito-postgres:
