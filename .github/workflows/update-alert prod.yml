name: Update Alerts PROD
run-name: Update Alerts PROD

env:
  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL_PROD }}
  SUPABASE_KEY: ${{ secrets.SUPABASE_KEY_PROD }}
  CRON_SECRET_KEY: ${{ secrets.CRON_SECRET_KEY }}

on:
  workflow_dispatch:
  schedule:
    # Ogni giorno alle 02:17 UTC: 04:17 in Italia d'estate, 03:17 d'inverno
    - cron: "17 2 * * *"

jobs:
  delete-supabase-storage:
    # L'esecuzione notturna parte solo con la variabile del repository
    # ALERT_CRON_ENABLED = true, che si imposta dopo la migrazione di PR2
    # (runbook G2, passo 8). Senza, lo schedule salta il job anche se il file
    # arriva su main prima della migrazione. Il lancio a mano funziona sempre.
    if: github.event_name != 'schedule' || vars.ALERT_CRON_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: "pnpm"
      - name: Install pnpm
        run: npm install -g pnpm
      - name: Install dependencies
        run: pnpm install
      - name: Run update customers and practices script
        run: pnpm update:alert
      - name: Send Telegram notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} -d text="PROD: Cron job ran and updated alerts."
