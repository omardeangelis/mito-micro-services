name: Update Priority PROD
run-name: Update Priority PROD

env:
  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL_PROD }}
  SUPABASE_KEY: ${{ secrets.SUPABASE_KEY_PROD }}

on:
  workflow_dispatch:
  schedule:
    # Ogni giorno alle 23:17 UTC: 01:17 in Italia d'estate, 00:17 d'inverno.
    # Primo dei cron di prod, mezz'ora prima di quello degli alert: dopo,
    # porterebbe a 1 la priorità dei followup appena creati
    - cron: "17 23 * * *"

jobs:
  update-priority:
    # Come il cron degli alert, l'esecuzione notturna parte solo con la variabile
    # del repository ALERT_CRON_ENABLED = true (runbook G2, passo 8): prima,
    # lo schedule salta il job. Il lancio a mano non dipende dalla variabile.
    if: github.event_name != 'schedule' || vars.ALERT_CRON_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: "pnpm"
      # pnpm is the one of packageManager, from pnpm/action-setup. The cron
      # scripts need only plain JavaScript packages: no install scripts, so
      # nothing native is built
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Run update priority script
        # The domain of the current production deployment. Only this step gets
        # the secret
        env:
          CRON_SECRET_KEY: ${{ secrets.CRON_SECRET_KEY }}
          CRON_BASE_URL: https://crm.dbmito.it
        run: pnpm update:priority
      - name: Send Telegram notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} -d text="PROD: Cron job ran and updated priority."
