name: Deploy Platform to Production
env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
on:
  push:
    branches:
      - main
jobs:
  Vercel-Deploy-Production:
    runs-on: ubuntu-latest
    steps:
      - uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false
      - uses: actions/checkout@v4
      # Build on the Node version the functions run on (engines.node in package.json)
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
      - name: Override git author for Vercel
        run: |
          git config user.email "omardeangelis.business@gmail.com"
          git config user.name "Omar De Angelis"
          git commit --amend --no-edit --reset-author
      # The version of the last production deploys, as the staging workflow
      - name: Install Vercel CLI
        run: pnpm add --global vercel@61.0.0
      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      # The build is production only with VERCEL_ENV=production (src/env.js),
      # which `vercel pull` writes when the project exposes the system env vars.
      # It stops on a missing production variable only without
      # SKIP_ENV_VALIDATION
      - name: Check the build is production
        run: |
          grep -qx 'VERCEL_ENV="production"' .vercel/.env.production.local
          if grep -q '^SKIP_ENV_VALIDATION=' .vercel/.env.production.local; then
            echo "::error::Remove SKIP_ENV_VALIDATION from the Production variables: the build would skip the check of the required ones"
            exit 1
          fi
      - name: Build Project Artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy Project Artifacts to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }} 