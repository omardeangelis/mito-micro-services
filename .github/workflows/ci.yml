# Checks every PR with the same steps Vercel runs before a deploy.
# Vercel runs `pnpm run build` (next build): it compiles, then lints src/ with
# ESLint (errors fail, warnings don't, nothing is auto-fixed) and type-checks
# with tsconfig.json. Lint repeats those two checks so they fail fast, test runs
# after lint, and build runs next build itself.
name: CI

on:
  pull_request:
    branches: [dev, main]

# A new push to the PR cancels the run still in progress
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Credentials live on Vercel; lint, tests and build don't need them
  SKIP_ENV_VALIDATION: "true"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Same ESLint run as next build; `pnpm lint:dev` fixes what it reports
      - name: ESLint
        run: pnpm exec next lint
      - name: Type check
        run: pnpm exec tsc --noEmit

  test:
    name: Test
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The `*.pg.test.ts` files run on it (src/test/pg.ts): Postgres 15, as
    # production. Each file creates its own database and drops it
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # `pnpm test --run` fails: pnpm reads --run as its own option
      - name: Vitest
        run: pnpm run test --run
      - name: No test database left
        run: |
          left=$(psql "$TEST_DATABASE_URL" -tAc "SELECT datname FROM pg_database WHERE datname LIKE 'mito_test_%'")
          if [ -n "$left" ]; then echo "Test databases not dropped: $left"; exit 1; fi

  build:
    name: Build
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Without SENTRY_AUTH_TOKEN no source maps are uploaded
      - name: Next build
        run: pnpm build
        env:
          # Two route modules create the Supabase client on import, and the
          # build imports them; nothing connects
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          SUPABASE_KEY: ci-placeholder
      # The backend on Cloud Run (api/): the bundle of the same server code
      - name: Backend build
        run: pnpm api:build
      # Starts the bundle and calls it: what fails only outside Next.js
      - name: Backend smoke
        run: pnpm api:smoke
