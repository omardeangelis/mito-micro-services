name: Update Customers and Pratices
run-name: Update Customers and Pratices

env:
  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
  SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
  
on:
  workflow_dispatch:
  # schedule:  # disabilitato su ambiente di test
  #   # Esecuzione alle 00:00 UTC (01:00 CET) ogni giorno
  #   - cron: "0 2 * * *"

jobs:
  update-customer-practices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: "pnpm"
      # pnpm is the one of packageManager, from pnpm/action-setup. The cron
      # scripts need only plain JavaScript packages: no install scripts, so
      # nothing native is built
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Run update customers and practices script
        # Staging: its own secret, and the bypass of Vercel's protection. Only
        # this step gets them
        env:
          CRON_SECRET_KEY: ${{ secrets.STAGING_CRON_SECRET_KEY }}
          CRON_BASE_URL: https://staging-crm.dbmito.it
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: pnpm update:pratices:dev
      - name: Send Telegram notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} -d text="Cron job ran and updated customers and practices."
