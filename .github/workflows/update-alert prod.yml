name: Update Alerts PROD
run-name: Update Alerts PROD

env:
  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL_PROD }}
  SUPABASE_KEY: ${{ secrets.SUPABASE_KEY_PROD }}

on:
  workflow_dispatch:
  schedule:
    # Ogni giorno alle 23:47 UTC: 01:47 in Italia d'estate, 00:47 d'inverno.
    # Dopo la mezzanotte italiana (23:00 UTC d'inverno): il cron lavora per il
    # giorno in cui gira in Italia, e prima sarebbe quello che finisce.
    # Secondo dei cron di prod, che girano in fila: priorità (23:17 UTC), alert,
    # clienti e pratiche (00:17), pulizia degli export (00:47)
    - cron: "47 23 * * *"

jobs:
  update-alert:
    # L'esecuzione notturna parte solo con la variabile del repository
    # ALERT_CRON_ENABLED = true, che si imposta dopo la migrazione di PR2 e
    # dopo una prima esecuzione a mano verde (runbook G2, passo 8). Senza, lo
    # schedule salta il job anche se il file arriva su main prima della
    # migrazione. Il lancio a mano non dipende dalla variabile.
    if: github.event_name != 'schedule' || vars.ALERT_CRON_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: "pnpm"
      # pnpm is the one of packageManager, from pnpm/action-setup. The cron
      # scripts need only plain JavaScript packages: no install scripts, so
      # nothing native is built
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
        env:
          GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_PACKAGES_TOKEN }}
      - name: Run update alerts script
        # The domain of the current production deployment. Only this step gets
        # the secret
        env:
          CRON_SECRET_KEY: ${{ secrets.CRON_SECRET_KEY }}
          CRON_BASE_URL: https://crm.dbmito.it
        run: pnpm update:alert
      - name: Send Telegram notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        # The response names the bot and the chat: only its status is logged
        run: |
          curl -s -o /dev/null -w "Telegram: HTTP %{http_code}\n" -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} -d text="PROD: Cron job ran and updated alerts."
