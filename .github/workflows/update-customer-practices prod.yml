name: Update Customers and Pratices PROD
run-name: Update Customers and Pratices PROD

env:
  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL_PROD }}
  SUPABASE_KEY: ${{ secrets.SUPABASE_KEY_PROD }}

on:
  workflow_dispatch:
  schedule:
    # Ogni giorno alle 00:17 UTC: 02:17 in Italia d'estate, 01:17 d'inverno.
    # Terzo dei cron di prod. Non prima delle 00:00 UTC: la route prende il
    # giorno dal server, in UTC, che fino ad allora è quello prima di quello
    # italiano
    - cron: "17 0 * * *"

jobs:
  update-customer-practices:
    # Come il cron degli alert, l'esecuzione notturna parte solo con la variabile
    # del repository ALERT_CRON_ENABLED = true (runbook G2, passo 8): prima,
    # lo schedule salta il job. Il lancio a mano non dipende dalla variabile.
    if: github.event_name != 'schedule' || vars.ALERT_CRON_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: "pnpm"
      - name: Install pnpm
        run: npm install -g pnpm
      - name: Install dependencies
        run: pnpm install
      - name: Run update customers and practices script
        # The domain of the current production deployment. Only this step gets
        # the secret
        env:
          CRON_SECRET_KEY: ${{ secrets.CRON_SECRET_KEY }}
          CRON_BASE_URL: https://crm.dbmito.it
        run: pnpm update:pratices
      - name: Send Telegram notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} -d text="PROD: Cron job ran and updated customers and practices."
