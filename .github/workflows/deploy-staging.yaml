# Each push to dev (a merged PR: dev only takes PRs) goes to staging in these
# steps, each only if the one before passed:
# 1. ci: the checks of the PRs (ci.yml), on the merged code;
# 2. plan: the migrations the deploy brings, with their SQL in the summary of
#    the run (apps/api/gcp/plan-migrations.ts);
# 3. approve: only when there are some, a person approves them (environment
#    staging-db, whose reviewers are the approvers);
# 4. api: the backend (apps/api) to Cloud Run, after a backup of the database
#    when there are migrations, then the migrations
#    (apps/api/gcp/deploy-staging.sh);
# 5. web: the frontend to Vercel, after the API it calls;
# then a Slack message with how it went, in every case.
name: Deploy Platform to Staging
env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  # Staging is its own Vercel project, staging-mito-micro-services: a
  # production deployment there, with that project's Production variables and
  # APP_ENV=staging, which keeps the app from being production (packages/env/src/index.js)
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_STAGING_PROJECT_ID }}
  # The fixed address of staging, a production domain of the staging project
  # (brain/chore/staging-vercel.md)
  STAGING_DOMAIN: staging-crm.dbmito.it
on:
  push:
    branches:
      - dev
  workflow_dispatch:
# One deploy at a time, so the alias ends on the last push, and never stopped
# halfway through the migrations
concurrency:
  group: deploy-staging
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  CI:
    uses: ./.github/workflows/ci.yml

  # The migrations this deploy brings: the journal of this commit against the
  # one of the commit staging runs, the label deployed-sha of its revision
  Plan:
    needs: CI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    permissions:
      contents: read
      id-token: write
    outputs:
      pending: ${{ steps.plan.outputs.pending }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      # The revision serving all the traffic, not the last one deployed: after
      # a failed /health or a rollback (RESTORE-STAGING.md) they differ
      - id: deployed
        run: |
          svc=(--project=mito-crm --region=europe-west3)
          rev=$(gcloud run services describe mito-crm-staging "${svc[@]}" --format=json |
            jq -r '[.status.traffic[] | select(.percent == 100)][0].revisionName // empty')
          sha=""
          if [ -n "$rev" ]; then
            sha=$(gcloud run revisions describe "$rev" "${svc[@]}" \
              --format='value(metadata.labels.deployed-sha)')
          fi
          echo "Staging serves $rev, commit ${sha:-unknown}"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
      - id: plan
        run: npx --yes tsx@4.23.15 apps/api/gcp/plan-migrations.ts
        env:
          DEPLOYED_SHA: ${{ steps.deployed.outputs.sha }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_DEPLOY_WEBHOOK_URL }}
          DEPLOY_ENVIRONMENT: staging
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}

  # Waits for a reviewer of the environment staging-db to approve the
  # migrations listed in the summary of the run. A rejection, or 30 days
  # without an answer, stops the deploy before anything changes
  Approve:
    needs: Plan
    if: needs.Plan.outputs.pending != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: staging-db
    steps:
      - run: echo "Migrations approved"

  # Builds the image of apps/api, pushes it to staging's repository and
  # deploys it by digest. GCP access is Workload Identity Federation for jobs
  # of this repository on dev in the environment staging
  # (apps/api/gcp/setup-ci-deploy.sh): no key in the repo
  API-Deploy-Staging:
    needs: [Plan, Approve]
    # Without migrations Approve is skipped; with them it must have succeeded
    if: >-
      !cancelled() && needs.Plan.result == 'success' &&
      (needs.Plan.outputs.pending == '0' || needs.Approve.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: staging
      url: https://mito-crm-staging-869830994359.europe-west3.run.app/health
    permissions:
      contents: read
      # GitHub's OIDC token, which Workload Identity Federation exchanges
      id-token: write
    env:
      IMAGE: europe-west3-docker.pkg.dev/mito-crm/mito-crm-staging/mito-api
      # Where the deploy stopped and the revision it left serving, for the
      # Slack message (deploy-staging.sh writes them)
      PHASE_FILE: /tmp/deploy-phase
      REVISION_FILE: /tmp/deploy-revision
      BACKUP_FILE: /tmp/deploy-backup
      # A backup before the migrations, when there are some; the label the
      # next Plan reads
      BACKUP: ${{ needs.Plan.outputs.pending != '0' && '1' || '0' }}
      COMMIT_SHA: ${{ github.sha }}
    outputs:
      phase: ${{ steps.report.outputs.phase }}
      revision: ${{ steps.report.outputs.revision }}
      backup: ${{ steps.report.outputs.backup }}
    steps:
      - run: printf immagine > "$PHASE_FILE"
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker europe-west3-docker.pkg.dev --quiet
      - uses: docker/setup-buildx-action@v3
      # Built from the checkout, which has no env file. The tag is the commit,
      # for people; the deploy takes the digest
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: sh apps/api/gcp/deploy-staging.sh "$IMAGE@$DIGEST"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - id: report
        if: always()
        run: |
          {
            echo "phase=$(cat "$PHASE_FILE" 2>/dev/null)"
            echo "revision=$(cat "$REVISION_FILE" 2>/dev/null)"
            echo "backup=$(cat "$BACKUP_FILE" 2>/dev/null)"
          } >> "$GITHUB_OUTPUT"

  Vercel-Deploy-Staging:
    needs: API-Deploy-Staging
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false
      - uses: actions/checkout@v4
      # Build on the Node version the functions run on (engines.node in package.json)
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
      - name: Override git author for Vercel
        run: |
          git config user.email "omardeangelis.business@gmail.com"
          git config user.name "Omar De Angelis"
          git commit --amend --no-edit --reset-author
      # One version: how `vercel env pull` writes Secret (Sensitive) variables
      # changes from one to another, and the checks below read its files
      - name: Install Vercel CLI
        run: pnpm add --global vercel@61.0.0
      # Before anything reaches Vercel. The staging project isn't the
      # production one; it protects every deployment, its production domain
      # included, with Vercel Authentication (Standard Protection would leave
      # that domain public); it isn't connected to Git, so no push deploys
      # there without these checks; and it owns the staging domain, verified,
      # on its Production environment, without a redirect, as its only domain
      # outside *.vercel.app: a production deployment takes all of them.
      # Deploys by hand or through the API, with a token, skip the checks
      # (brain/chore/staging-vercel.md)
      - name: Check the staging project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          PRODUCTION_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          api() {
            curl -fsS --max-time 30 -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com$1?teamId=$VERCEL_ORG_ID${2:+&$2}"
          }
          if [ -z "$VERCEL_PROJECT_ID" ] || [ "$VERCEL_PROJECT_ID" = "$PRODUCTION_PROJECT_ID" ]; then
            echo "::error::VERCEL_STAGING_PROJECT_ID must be set and differ from VERCEL_PROJECT_ID"
            exit 1
          fi
          if ! project="$(api "/v9/projects/$VERCEL_PROJECT_ID")" || ! jq -e 'type == "object"' <<< "$project" > /dev/null; then
            echo "::error::The Vercel API didn't return the staging project"
            exit 1
          fi
          if ! jq -e --arg prod "$PRODUCTION_PROJECT_ID" '.id != $prod' <<< "$project" > /dev/null; then
            echo "::error::VERCEL_STAGING_PROJECT_ID names the production project"
            exit 1
          fi
          if ! jq -e '.ssoProtection.deploymentType == "all"' <<< "$project" > /dev/null; then
            echo "::error::The staging project must protect All Deployments with Vercel Authentication (Settings → Deployment Protection)"
            exit 1
          fi
          if ! jq -e '.link == null' <<< "$project" > /dev/null; then
            echo "::error::Disconnect the staging project from Git (Settings → Git): a deploy from Git would skip these checks"
            exit 1
          fi
          if ! domain="$(api "/v9/projects/$VERCEL_PROJECT_ID/domains/$STAGING_DOMAIN")" || ! jq -e --arg d "$STAGING_DOMAIN" 'type == "object" and .name == $d' <<< "$domain" > /dev/null; then
            echo "::error::$STAGING_DOMAIN is not a domain of the staging project, or the Vercel API didn't answer"
            exit 1
          fi
          if ! jq -e '(.redirect // "") == "" and (.gitBranch // "") == "" and .customEnvironmentId == null' <<< "$domain" > /dev/null; then
            echo "::error::$STAGING_DOMAIN must be on the Production environment, without a redirect (staging project → Settings → Domains)"
            exit 1
          fi
          if ! jq -e '.verified == true' <<< "$domain" > /dev/null; then
            echo "::error::$STAGING_DOMAIN is not verified (staging project → Settings → Domains)"
            exit 1
          fi
          # Up to 100 domains in one page; more fails as an unknown answer
          if ! domains="$(api "/v9/projects/$VERCEL_PROJECT_ID/domains" "limit=100")" || ! jq -e 'type == "object" and (.domains | type == "array") and .pagination.next == null' <<< "$domains" > /dev/null; then
            echo "::error::The Vercel API didn't return the domains of the staging project"
            exit 1
          fi
          if ! jq -e --arg d "$STAGING_DOMAIN" '[.domains[].name | select(endswith(".vercel.app") | not)] == [$d]' <<< "$domains" > /dev/null; then
            echo "::error::The staging project has domains besides $STAGING_DOMAIN and *.vercel.app: remove them (staging project → Settings → Domains), a production deployment would take them"
            exit 1
          fi
      # The Production variables of the staging project. A .vercel folder in
      # the commit would be merged into what vercel pull writes
      - name: Pull Vercel Environment Information
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          rm -rf .vercel
          vercel pull --yes --environment=production
      # A production deployment of the staging project is staging only with
      # APP_ENV=staging; without it the app would be production
      - name: Check the build is staging
        run: |
          file=.vercel/.env.production.local
          if ! grep -qx 'VERCEL_ENV="production"' "$file"; then
            echo "::error::vercel pull wrote no VERCEL_ENV=\"production\": turn on Enable access to System Environment Variables in the staging project"
            exit 1
          fi
          if grep -qx 'APP_ENV="\[SENSITIVE\]"' "$file"; then
            echo "::error::APP_ENV in the staging project is a Secret, so the build can't read it: delete it and create it again as Config"
            exit 1
          fi
          if ! grep -qx 'APP_ENV="staging"' "$file"; then
            echo "::error::Set APP_ENV=staging in the Production variables of the staging project: without it staging is production"
            exit 1
          fi
          if grep -q '^SKIP_ENV_VALIDATION=' "$file"; then
            echo "::error::Remove SKIP_ENV_VALIDATION from the Production variables of the staging project: the build would skip the check of the required ones"
            exit 1
          fi
          if grep -q '^NODE_ENV=' "$file"; then
            echo "::warning::NODE_ENV has no effect on Vercel, which sets it to production: remove it from the staging project, APP_ENV=staging marks staging"
          fi
      # Staging must not reach the production database or storage. Each
      # environment keeps both in one Supabase project, whose ref is the host
      # of NEXT_PUBLIC_SUPABASE_URL (https://<ref>.supabase.co) and is also in
      # the connection string, as the host (db.<ref>.supabase.co) or the
      # pooler user (postgres.<ref>). Production is read from the production
      # project, staging from the variables the build just pulled. Prints
      # names only, and removes the files it pulls
      - name: Check staging has its own database and storage
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          PRODUCTION_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          dir="$(mktemp -d "$RUNNER_TEMP/staging-env-check.XXXXXX")"
          trap 'rm -rf "$dir"' EXIT
          # A stop signal waits for the running command, then removes the files
          trap 'exit 1' TERM INT
          VERCEL_PROJECT_ID="$PRODUCTION_PROJECT_ID" vercel env pull "$dir/Production" --yes --environment=production > /dev/null
          cp .vercel/.env.production.local "$dir/Staging"
          for view in Production Staging; do
            if [ ! -s "$dir/$view" ]; then
              echo "::error::Vercel gave no $view variables"
              exit 1
            fi
          done
          project_ref() {
            sed -nE 's#^NEXT_PUBLIC_SUPABASE_URL="https://([a-z0-9]+)\.supabase\.co/?"$#\1#p' "$1"
          }
          # Set, and not only spaces or escaped line breaks
          has_value() {
            local value="${1#*=}"
            value="${value#\"}"
            value="${value%\"}"
            value="${value//\\n/}"
            value="${value//\\r/}"
            [ -n "${value//[[:space:]]/}" ]
          }
          prod_ref="$(project_ref "$dir/Production")"
          if ! [[ "$prod_ref" =~ ^[a-z0-9]+$ ]]; then
            echo "::error::NEXT_PUBLIC_SUPABASE_URL in Production is not one https://<project>.supabase.co: the check can't tell the projects apart"
            exit 1
          fi
          file="$dir/Staging"
          staging_ref="$(project_ref "$file")"
          if ! [[ "$staging_ref" =~ ^[a-z0-9]+$ ]]; then
            echo "::error::NEXT_PUBLIC_SUPABASE_URL in the staging project is not one https://<project>.supabase.co"
            exit 1
          fi
          status=0
          if [ "$staging_ref" = "$prod_ref" ]; then
            echo "::error::The storage of the staging project is the production one"
            status=1
          fi
          connection="$(grep '^SUPABASE_DB_CONNECTION_STRING=' "$file" || true)"
          if ! has_value "$connection"; then
            echo "::error::SUPABASE_DB_CONNECTION_STRING is not set in the staging project"
            status=1
          elif [ "$connection" = 'SUPABASE_DB_CONNECTION_STRING="[SENSITIVE]"' ]; then
            echo "::error::SUPABASE_DB_CONNECTION_STRING in the staging project is a Secret, so the check can't read it: save it as Config"
            status=1
          else
            connection="${connection,,}"
            if [[ "$connection" == *"$prod_ref"* ]] || ! [[ "$connection" =~ (@db\.${staging_ref}\.supabase\.co[:/]|://postgres\.${staging_ref}[:@]) ]]; then
              echo "::error::SUPABASE_DB_CONNECTION_STRING in the staging project is not the database of the project of its NEXT_PUBLIC_SUPABASE_URL, or is the production one"
              status=1
            fi
          fi
          for name in SUPABASE_MITO_PSW SUPABASE_KEY; do
            if ! has_value "$(grep "^$name=" "$file" || true)"; then
              echo "::error::$name is not set in the staging project"
              status=1
            fi
          done
          exit "$status"
      # Without the token: the build runs the install scripts and the code of
      # the branch, and needs only what vercel pull wrote
      - name: Build Project Artifacts
        run: vercel build --prod
      - name: Deploy Project Artifacts to Vercel
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          url="$(vercel deploy --prebuilt --prod)"
          echo "url=$url" >> "$GITHUB_OUTPUT"
      # A production deployment takes the project's domains by itself, unless
      # the project turns that off (an Instant Rollback does): the alias makes
      # sure. `vercel alias set` takes every 409 as done, so the API says where
      # the domain points
      - name: Point the staging domain to the deployment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: |
          vercel alias set "$DEPLOYMENT_URL" "$STAGING_DOMAIN"
          if ! alias="$(curl -fsS --max-time 30 -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v4/aliases/$STAGING_DOMAIN?teamId=$VERCEL_ORG_ID")" || ! jq -e --arg host "${DEPLOYMENT_URL#https://}" '.deployment.url == $host' <<< "$alias" > /dev/null; then
            echo "::error::$STAGING_DOMAIN doesn't point to the new deployment"
            exit 1
          fi

  # One Slack message per run, whether it succeeded, failed or was cancelled,
  # on the channel of every environment's deploys (send-deploy-report.ts).
  # Slack not answering leaves the run as it is
  Report:
    needs: [CI, Plan, Approve, API-Deploy-Staging, Vercel-Deploy-Staging]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: apps/api/gcp
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
      - run: npx --yes tsx@4.23.15 apps/api/gcp/send-deploy-report.ts
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_DEPLOY_WEBHOOK_URL }}
          DEPLOY_ENVIRONMENT: staging
          CI_RESULT: ${{ needs.CI.result }}
          PLAN_RESULT: ${{ needs.Plan.result }}
          PENDING: ${{ needs.Plan.outputs.pending }}
          APPROVE_RESULT: ${{ needs.Approve.result }}
          API_RESULT: ${{ needs.API-Deploy-Staging.result }}
          API_PHASE: ${{ needs.API-Deploy-Staging.outputs.phase }}
          API_REVISION: ${{ needs.API-Deploy-Staging.outputs.revision }}
          API_BACKUP: ${{ needs.API-Deploy-Staging.outputs.backup }}
          VERCEL_RESULT: ${{ needs.Vercel-Deploy-Staging.result }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
