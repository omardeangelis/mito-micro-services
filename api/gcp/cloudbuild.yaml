# Builds the image of api/ from the repo root and pushes it to Artifact
# Registry. Started by api/gcp/build.sh, as the mito-crm-build service account
steps:
  - name: gcr.io/cloud-builders/docker
    # BuildKit, for the secret the Dockerfile mounts on pnpm install
    env: ["DOCKER_BUILDKIT=1"]
    secretEnv: ["GITHUB_PACKAGES_TOKEN"]
    args:
      - build
      - --secret
      - id=github_packages_token,env=GITHUB_PACKAGES_TOKEN
      - -f
      - api/Dockerfile
      - -t
      - ${_IMAGE}
      - .
# A GitHub token with read:packages, for the private @s-p-a-talo packages
availableSecrets:
  secretManager:
    - versionName: projects/mito-crm/secrets/github-packages-token/versions/latest
      env: GITHUB_PACKAGES_TOKEN
images: ["${_IMAGE}"]
serviceAccount: projects/mito-crm/serviceAccounts/mito-crm-build@mito-crm.iam.gserviceaccount.com
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
timeout: 1200s
